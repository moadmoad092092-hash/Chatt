<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#087f46" /><meta name="description" content="شات العرب — مساعدك الذكي باللغة العربية" /><title>شات العرب | مساعدك الذكي</title><link rel="icon" href="/logo.svg" type="image/svg+xml" /><link rel="stylesheet" href="/style.css" /></head>
<body><div class="app-shell"><aside class="sidebar" id="sidebar"><div class="brand"><img src="/logo.svg" alt="شعار شات العرب" class="brand-logo" /><div><strong>شات العرب</strong><small>مساعدك الذكي</small></div><button class="icon-btn mobile-close" id="closeSidebar" aria-label="إغلاق القائمة">×</button></div><button class="new-chat" id="newChat"><span>＋</span> محادثة جديدة</button><div class="side-label">محادثاتك</div><div id="chatHistory" class="chat-history"></div><div class="sidebar-bottom"><div class="status-dot" id="statusDot"></div><div><strong id="statusText">جاري التحقق من الاتصال</strong><small>مدعوم بتقنية Gemini</small></div></div></aside><main class="main"><header class="topbar"><button class="icon-btn menu-btn" id="openSidebar" aria-label="فتح القائمة">☰</button><div class="top-title"><span class="tiny-mark">✳</span> شات العرب</div><div class="model-pill"><span></span> مساعد ذكي</div></header><section class="conversation" id="conversation"><div class="welcome" id="welcome"><div class="welcome-logo"><img src="/logo.svg" alt="" /></div><p class="eyebrow">مرحباً بك في شات العرب</p><h1>أهلاً بك! كيف أقدر أساعدك؟</h1><p class="welcome-copy">اسأل، تعلّم، اكتب، أو استكشف فكرة جديدة. أتابع معك خطوة بخطوة.</p><div class="suggestions"><button class="suggestion" data-prompt="اشرح لي كيف يعمل الذكاء الاصطناعي بطريقة بسيطة"><span>✦</span><b>تعلّم شيئاً جديداً</b><small>اشرح لي الذكاء الاصطناعي</small></button><button class="suggestion" data-prompt="ساعدني في كتابة خطة لمشروع صغير"><span>↗</span><b>طوّر فكرة مشروع</b><small>لنحوّل فكرتك إلى خطة</small></button><button class="suggestion" data-prompt="علّمني أساسيات البرمجة للمبتدئين"><span>⌘</span><b>اكتب وتعلّم البرمجة</b><small>ابدأ من الصفر خطوة بخطوة</small></button><button class="suggestion" data-prompt="اكتب لي رسالة عربية جميلة لصديق"><span>✎</span><b>اكتب نصاً مميزاً</b><small>رسالة أو مقال أو فكرة</small></button></div></div><div class="messages" id="messages" aria-live="polite"></div></section><div class="composer-wrap"><form class="composer" id="chatForm"><textarea id="prompt" rows="1" maxlength="12000" placeholder="اكتب رسالتك هنا..." aria-label="رسالتك"></textarea><button class="send-btn" id="sendBtn" type="submit" aria-label="إرسال الرسالة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" /></svg></button></form><div class="composer-note">قد يخطئ الذكاء الاصطناعي أحياناً؛ تحقّق من المعلومات المهمة.</div></div></main></div><div class="scrim" id="scrim"></div><script src="/app.js"></script></body></html>
